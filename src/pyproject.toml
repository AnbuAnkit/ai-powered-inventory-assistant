[project]
name = "ai-powered-inventory-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ankit", email = "ankitmahto87@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "langchain-google-genai>=4.4.2",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
ai-powered-inventory-assistant = "ai_powered_inventory_assistant:main"
inventory-api = "ai_powered_inventory_assistant.api:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
